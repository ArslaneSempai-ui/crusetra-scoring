# The suite on the three systems a client may run, on the two Node lines the package supports:
# a commit that is green on one Mac says nothing about the Windows machine of a lender's analyst.
# The matrix mirrors Crusetra Routing's verifier workflow (same pinned actions, same read-only
# token); src/ci.test.ts reads this file and refuses a matrix that loses a system or stops
# running `npm test`.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository and runs cases; it runs on pull requests, so on code
# someone else proposes, and a write token has no place there.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false          # one system or version failing does not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned by commit, not by tag: a tag can be moved, a commit cannot. The
      # version stays written beside the hash so that someone can still read what is pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The install the README prescribes: the lockfile is enforced and no install script of
      # any dependency runs.
      - run: npm ci --ignore-scripts

      # A hang is a named failure, not a six-hour job: the first Windows run of Routing's matrix
      # (2026-09-29) went silent and ran until someone cancelled it. The same cap as Routing's.
      - name: suite
        timeout-minutes: 60
        run: npm test
